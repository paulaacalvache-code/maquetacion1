<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Maquetacion Basica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
    <!--ACA COLOCO MIS ESTILOS CSS PARA PINTAR LAS CAJAS con la etiqueta style-->
    <style>
        *{
            box-sizing: border-box
        }

        body {
            margin: 0;
            padding: 0;
        }
        .cajaColor1 {
            background-color: cyan;
            height: 300px;
        }
        .cajaColor2 {
            background-color: magenta;
            height: 300px;
        }
        .cajaColor3 {
            background-color: yellow;
            height: 300px;
        }
        .cajaColor4 {
            background-color: black;
            height: 300px;
        }

    </style>
  </head>
  <body>
    <h1 class="text-center">Maquetacion Basica</h1>
    <div class="container-fluid">
        <div class="row">
            <div class="col-12 col-sm-12 col-md-6 col-lg-6 col-xl-4 col-xxl-4 cajaColor1 d-flex justify-content-center">
                <img src="multimedia/Hola.wp.jfif" alt="hola hola" height="100%">
            </div>
            <div class="col-12 col-sm-12 col-md-6 col-lg-6 col-xl-4 col-xxl-4 cajaColor2">
                <h2>Este es un ejercicio de maquetación.</h2>
            </div>
            <div class="col-12 col-sm-12 col-md-6 col-lg-6 col-xl-4 col-xxl-4 cajaColor3">
                <h2><iframe width="500" height="280" src="https://www.youtube.com/embed/UhTl62q2o5k?si=s01QYPaHLA8EDXzp" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></h2>
            </div>
            <div class="col-12 col-sm-12 col-md-6 col-lg-6 col-xl-12 col-xxl-12 cajaColor4">
                <h2 class="text-white">Increible...</h2>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js" integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous"></script>
  </body>
</html>
